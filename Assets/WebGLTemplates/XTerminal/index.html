<!DOCTYPE html>
<html lang="ja">
<head>
  <meta charset="utf-8">
  <meta http-equiv="Content-Type" content="text/html; charset=utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
  <title>{{{ PRODUCT_NAME }}}</title>
  <style>
    * {
      margin: 0;
      padding: 0;
      box-sizing: border-box;
    }

    html, body {
      width: 100%;
      height: 100%;
      overflow: hidden;
      background-color: #1a1a2e;
      font-family: 'Segoe UI', 'Helvetica Neue', Arial, sans-serif;
      color: #e0e0e0;
    }

    #unity-container {
      width: 100%;
      height: 100%;
      display: flex;
      flex-direction: column;
      align-items: center;
      justify-content: center;
    }

    #unity-canvas {
      width: 100%;
      height: 100%;
      background: #0f0f23;
      cursor: default;
    }

    #unity-loading-bar {
      position: absolute;
      top: 50%;
      left: 50%;
      transform: translate(-50%, -50%);
      text-align: center;
    }

    #unity-logo {
      margin-bottom: 24px;
    }

    #unity-logo .terminal-icon {
      font-size: 48px;
      color: #00d4aa;
      font-family: monospace;
      letter-spacing: -2px;
    }

    #unity-logo .terminal-title {
      font-size: 18px;
      color: #888;
      margin-top: 8px;
      letter-spacing: 4px;
      text-transform: uppercase;
    }

    #unity-progress-bar-empty {
      width: 300px;
      height: 4px;
      background: #2a2a4a;
      border-radius: 2px;
      overflow: hidden;
    }

    #unity-progress-bar-full {
      width: 0%;
      height: 100%;
      background: linear-gradient(90deg, #00d4aa, #00b4d8);
      border-radius: 2px;
      transition: width 0.2s ease;
    }

    #unity-loading-text {
      margin-top: 12px;
      font-size: 12px;
      color: #666;
      font-family: monospace;
    }

    #unity-warning {
      position: absolute;
      left: 50%;
      top: 10%;
      transform: translateX(-50%);
      background: #2a1a1a;
      border: 1px solid #aa3333;
      border-radius: 8px;
      padding: 16px 24px;
      display: none;
      max-width: 500px;
    }

    #unity-footer {
      position: absolute;
      bottom: 0;
      width: 100%;
      text-align: center;
      padding: 8px;
      font-size: 11px;
      color: #444;
      background: rgba(0, 0, 0, 0.3);
    }

    #unity-footer a {
      color: #00d4aa;
      text-decoration: none;
    }

    #unity-footer a:hover {
      text-decoration: underline;
    }

    #unity-fullscreen-button {
      position: absolute;
      bottom: 12px;
      right: 12px;
      width: 36px;
      height: 36px;
      background: rgba(0, 212, 170, 0.15);
      border: 1px solid rgba(0, 212, 170, 0.3);
      border-radius: 6px;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      transition: background 0.2s;
      z-index: 10;
    }

    #unity-fullscreen-button:hover {
      background: rgba(0, 212, 170, 0.3);
    }

    #unity-fullscreen-button svg {
      width: 18px;
      height: 18px;
      fill: #00d4aa;
    }
  </style>
</head>
<body>
  <div id="unity-container">
    <canvas id="unity-canvas" tabindex="-1"></canvas>
    <div id="unity-loading-bar">
      <div id="unity-logo">
        <div class="terminal-icon">&gt;_</div>
        <div class="terminal-title">XTerminal</div>
      </div>
      <div id="unity-progress-bar-empty">
        <div id="unity-progress-bar-full"></div>
      </div>
      <div id="unity-loading-text">Loading...</div>
    </div>
    <div id="unity-warning"></div>
  </div>

  <div id="unity-fullscreen-button" title="Fullscreen">
    <svg viewBox="0 0 24 24">
      <path d="M5 5h5V3H3v7h2V5zm9-2v2h5v5h2V3h-7zm7 14h-2v5h-5v2h7v-7zM5 19v-5H3v7h7v-2H5z"/>
    </svg>
  </div>

  <div id="unity-footer">
    XTerminal &mdash; Unity WebGL Demo
  </div>

  <script>
    var container = document.querySelector("#unity-container");
    var canvas = document.querySelector("#unity-canvas");
    var loadingBar = document.querySelector("#unity-loading-bar");
    var progressBarFull = document.querySelector("#unity-progress-bar-full");
    var loadingText = document.querySelector("#unity-loading-text");
    var warningBanner = document.querySelector("#unity-warning");
    var fullscreenButton = document.querySelector("#unity-fullscreen-button");

    function unityShowBanner(msg, type) {
      warningBanner.style.display = "block";
      warningBanner.style.color = type === "error" ? "#ff6666" : "#ffcc00";
      warningBanner.innerHTML = msg;
      setTimeout(function () {
        warningBanner.style.display = "none";
      }, 5000);
    }

    var buildUrl = "Build";
    var loaderUrl = buildUrl + "/{{{ LOADER_FILENAME }}}";
    var config = {
      dataUrl: buildUrl + "/{{{ DATA_FILENAME }}}",
      frameworkUrl: buildUrl + "/{{{ FRAMEWORK_FILENAME }}}",
#if USE_WASM
      codeUrl: buildUrl + "/{{{ CODE_FILENAME }}}",
#endif
#if MEMORY_FILENAME
      memoryUrl: buildUrl + "/{{{ MEMORY_FILENAME }}}",
#endif
#if SYMBOLS_FILENAME
      symbolsUrl: buildUrl + "/{{{ SYMBOLS_FILENAME }}}",
#endif
      streamingAssetsUrl: "StreamingAssets",
      companyName: "{{{ COMPANY_NAME }}}",
      productName: "{{{ PRODUCT_NAME }}}",
      productVersion: "{{{ PRODUCT_VERSION }}}",
      showBanner: unityShowBanner,
    };

    var script = document.createElement("script");
    script.src = loaderUrl;
    script.onload = function () {
      createUnityInstance(canvas, config, function (progress) {
        progressBarFull.style.width = (100 * progress) + "%";
        loadingText.textContent = "Loading... " + Math.round(100 * progress) + "%";
      }).then(function (unityInstance) {
        loadingBar.style.display = "none";
        fullscreenButton.onclick = function () {
          unityInstance.SetFullscreen(1);
        };
      }).catch(function (message) {
        alert(message);
      });
    };
    document.body.appendChild(script);
  </script>
</body>
</html>
